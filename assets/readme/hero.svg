<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Z-BLOG — KingDove 的绳网风格纯静态博客">
  <defs>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1D801"/>
      <stop offset="1" stop-color="#6bbd00"/>
    </linearGradient>
  </defs>

  <!-- 黑底（站点 header 同款纯黑） -->
  <rect width="1200" height="320" fill="#050505"/>

  <!-- 背景大字水印（站点背景同款 italic 水印） -->
  <text x="920" y="290" text-anchor="middle" font-family="'Arial Black','Segoe UI',sans-serif" font-size="230" font-style="italic" font-weight="900" fill="#111111" letter-spacing="4">Blog</text>
  <text x="180" y="120" text-anchor="middle" font-family="'Arial Black','Segoe UI',sans-serif" font-size="150" font-style="italic" font-weight="900" fill="#0d0d0d" letter-spacing="4">Z</text>

  <!-- 斜切装饰条（导航高亮同款 skew 平行四边形） -->
  <g transform="skewX(-14)">
    <rect x="60" y="52" width="120" height="18" rx="4" fill="url(#zg)"/>
    <rect x="196" y="52" width="34" height="18" rx="4" fill="#383838"/>
    <rect x="1040" y="250" width="34" height="18" rx="4" fill="#383838"/>
    <rect x="1088" y="250" width="120" height="18" rx="4" fill="url(#zg)"/>
  </g>

  <!-- 顶部小字 -->
  <text x="600" y="76" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" font-style="italic" fill="#808080" letter-spacing="6">KINGDOVE'S BLOG · ASTRO EDITION</text>

  <!-- 主标题（404 页同款黄绿渐变字） -->
  <text x="600" y="196" text-anchor="middle" font-family="'Arial Black','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="120" font-style="italic" font-weight="900" fill="url(#zg)" letter-spacing="8">Z-BLOG</text>

  <!-- 副标题 -->
  <text x="600" y="252" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="2">以《绝区零》绳网为视觉原型的纯静态博客</text>
  <text x="600" y="290" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" fill="#808080" letter-spacing="1">Astro 5 · 零框架运行时 · PWA 离线 · RSS / Sitemap · 站内搜索</text>
</svg>
